name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: app
        run: npm run build:web

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Use the repo's signing key so updates install over the old version
        run: |
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Cellwatch.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Cellwatch.apk \
            --target "$GITHUB_SHA" \
            --title "Cellwatch 1.${{ github.run_number }}" \
            --notes "Open this page on your Android phone, tap Cellwatch.apk to download, then open the file to install. Built from ${GITHUB_SHA::7}."
